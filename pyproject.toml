[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shortform-support-radar"
version = "0.3.0"
description = "Candidate-only public support-program radar for AI short drama and Lezhin Snack IP"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "ruff>=0.16,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
pretty = true
show_error_codes = true
warn_unused_configs = true
