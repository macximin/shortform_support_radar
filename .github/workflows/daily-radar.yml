name: daily radar

# 13:00 KST is 04:00 UTC. GitHub may start a scheduled run late under load, so
# treat the time as approximate; nothing here depends on the exact minute.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# Standard GitHub-hosted runners on a public repository are free, and this job
# uploads no artifacts, so it accrues no storage either. Keep it that way.
permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the source registry
        run: python3 tools/collect_public_notices.py validate

      - name: Run the tests
        run: python3 tests/test_support_radar.py

      - name: Resolve today's run directory
        id: run
        run: echo "dir=evidence/$(TZ=Asia/Seoul date +%F)/daily" >> "$GITHUB_OUTPUT"

      - name: Collect
        run: python3 tools/collect_public_notices.py collect --source all --out "${{ steps.run.outputs.dir }}"

      - name: Write STATUS.md
        run: python3 tools/collect_public_notices.py status --current "${{ steps.run.outputs.dir }}" --out STATUS.md

      - name: Summarise the change
        id: summary
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, subprocess, sys
          sys.path.insert(0, "src")
          from shortform_support_radar.receipts import diff_directories, load_directory, open_candidates, previous_run_dir

          current = pathlib.Path("${{ steps.run.outputs.dir }}")
          previous = previous_run_dir(current)
          open_now = len(open_candidates(load_directory(current)))
          if previous is None:
              print(f"line=first run, {open_now} open")
          else:
              report = diff_directories(previous, current, "")
              appeared = report["appeared_total"]
              gone = report["disappeared_total"]
              print(f"line=+{appeared} new, -{gone} delisted, {open_now} open")
          PY

      - name: Commit the run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: daily radar $(TZ=Asia/Seoul date +%F) — ${{ steps.summary.outputs.line }}"
          git push
