name: reachability probe

# Temporary diagnostic: can a GitHub-hosted runner reach the registered boards?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe every registered host
        run: |
          python3 - <<'PY'
          import socket, ssl, time, urllib.request, urllib.error
          TARGETS = [
              ("kocca", "https://www.kocca.kr/kocca/pims/list.do?menuNo=204104"),
              ("welcon", "https://welcon.kocca.kr/ko/event/all"),
              ("kofic", "https://www.kofic.or.kr/kofic/business/prom/promotionBoardList.do"),
              ("mcst", "https://www.mcst.go.kr/site/s_culture/cultureSp/cultureSpList.jsp"),
              ("bizinfo", "https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/list.do"),
          ]
          UAS = {
              "radar": "shortform-support-radar/0.3 (public-candidate-research; no-auth)",
              "browser": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36",
          }
          for name, url in TARGETS:
              host = urllib.parse.urlsplit(url).netloc
              t = time.perf_counter()
              try:
                  ip = socket.gethostbyname(host)
                  dns = f"{ip} in {time.perf_counter()-t:.2f}s"
              except Exception as e:
                  dns = f"DNS FAIL {e}"
              t = time.perf_counter()
              try:
                  with socket.create_connection((host, 443), timeout=25):
                      tcp = f"ok in {time.perf_counter()-t:.2f}s"
              except Exception as e:
                  tcp = f"TCP FAIL {type(e).__name__} after {time.perf_counter()-t:.1f}s"
              results = []
              for label, ua in UAS.items():
                  t = time.perf_counter()
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "text/html"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          n = len(r.read(200000))
                      results.append(f"{label}={r.status}/{n}B/{time.perf_counter()-t:.1f}s")
                  except Exception as e:
                      results.append(f"{label}=FAIL {type(e).__name__} after {time.perf_counter()-t:.1f}s")
              print(f"{name:8} dns={dns:28} tcp={tcp:44} " + "  ".join(results), flush=True)
          PY
